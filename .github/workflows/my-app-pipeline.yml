name: CI

on:
  push:
    branches: ["lucasMezza_p2_dev","lucasMezza_p2_base"]

  workflow_dispatch:

env: 
  SEM_VERSION: ""
  IMAGE_NAME:  ""

jobs:
  ## 🔧 1. 
  Static-codecheck:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install required python libraries
        run: | 
            pip install -r requirements.txt
            pip install flake8

      - name: Run Unit Tests
        run: python -m pytest test/unit -v

      - name: Code inspection (flake8)
        run: flake8 restapp

  ## 🔧 2. 
  Build:
    runs-on: self-hosted
    needs: Static-codecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: tag docker image
        run: |
          BRANCH_NAME=${GITHUB_REF##*/}
          echo "IMAGE_TAG=$BRANCH_NAME:1.0.0" >> $GITHUB_ENV

      - name: build docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/restapp:${{ env.IMAGE_TAG }} .

      - name: push docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/restapp:${{ env.IMAGE_TAG }}

