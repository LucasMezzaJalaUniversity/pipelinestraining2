name: CI

on:
  push:
    branches: ["lucasMezza_p2_dev","lucasMezza_p2_base"]

  workflow_dispatch:

env: 
  SEM_VERSION: ${{ github.run_number }}
  IMAGE_NAME:  restapp
  BRANCH_NAME:  ${{ github.ref_name }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  ## 🔧 1. 
  Static-codecheck:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install required python libraries
        run: | 
            pip install -r requirements.txt
            pip install flake8

      - name: Run Unit Tests
        run: python -m pytest test/unit -v

      - name: Code inspection (flake8)
        run: flake8 restapp

  ## 🔧 2. 
  Build:
    runs-on: self-hosted
    needs: Static-codecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: tag docker image
        run: echo "IMAGE_TAG=${BRANCH_NAME}-1.0.0+${SEM_VERSION}" >> $env:GITHUB_ENV

      - name: build docker image
        run: docker build -t "$env:DOCKER_USERNAME/$env:IMAGE_NAME:$env:IMAGE_TAG" .

      - name: push docker image
        run: docker push "$env:DOCKER_USERNAME/$env:IMAGE_NAME:$env:IMAGE_TAG"

  ## 🚀 3. 
  deploy-dev:
    runs-on: self-hosted
    needs: Build
    environment:
      name: Develop
      url: http://localhost:5000

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Pull Redis image
        run: docker pull redis:alpine
 
      - name: Pull docker image  
        run:  docker pull "$env:DOCKER_USERNAME/$env:IMAGE_NAME:$env:IMAGE_TAG"

      - name: Stop existing Redis container if running
        run: |
          docker stop redisService || true
          docker rm redisService || true

      - name: Run Redis container
        run: docker run --name "redisService" -p "6379:6379" -d redis:alpine

      - name: Get Redis container IP
        id: redisip
        run: echo "REDIS_IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' redisService)" >> $env:$GITHUB_ENV

      - name: Stop and remove old REST app container
        run: |
          docker stop restapp || true
          docker rm restapp || true

      - name: Run REST app container
        run: |
          docker run --name "restapp" --add-host "redis:$env:REDIS_IP" -p "5000:5000" -d "$env:DOCKER_USERNAME/$env:IMAGE_NAME:$env:IMAGE_TAG"

      - name: Run Integration Tests
        run: |
          pip install -r requirements.txt
          python -m pytest test/integration -v

  # ## 🚀 4. 
  # deploy-prod:
  #   runs-on: self-hosted
