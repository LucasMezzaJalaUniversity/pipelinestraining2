name: CI

on:
  push:
    branches: ["lucasMezza_p1_dev","lucasMezza_p1_base"]

  workflow_dispatch:

env: 
  SEM_VERSION: ""
  IMAGE_NAME:  ""

jobs:
  ## 🔧 1. 
  Static-codecheck:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install required python libraries
        uses: | 
            pip install -r requirements.txt
            pip install flake8

      - name: Run Unit Tests
        uses: python -m pytest test/unit -v

      - name: Code inspection (flake8)
        run: flake8 restApp

